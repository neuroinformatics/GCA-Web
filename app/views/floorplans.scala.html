@(account: Option[Account], conference: Conference)

@template(account, Some(conference), "Floorplans") {

<div class="hidden-data">
  <div id="conference-uuid">@conference.uuid</div>
  <div id="map-type">floorplans</div>
</div>

<script data-main='@routes.Assets.at("javascripts/locations.js")' src='@routes.Assets.at("lib/requirejs/require.min.js")'></script>

<!-- The locations of the conference -->
<div class="page-header">
  <h1>Floorplans</h1>
</div>
<div class="col-md-12" id="floorplans" style="text-align:center"></div>
}
